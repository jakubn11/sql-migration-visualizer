<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SQL Migration Visualizer features</title>
  <desc id="desc">Feature overview for SQL Migration Visualizer showing six capability cards: Timeline View, Schema Diff, ER Diagram, Validation, Suggested Migrations, and Risk Scoring.</desc>
  <defs>
    <linearGradient id="pageBg" x1="98" y1="40" x2="1114" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131821"/>
      <stop offset="1" stop-color="#1B222D"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="120" x2="1010" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58D1C9"/>
      <stop offset="0.58" stop-color="#6AA6FF"/>
      <stop offset="1" stop-color="#8ABBFF"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="138" y1="240" x2="1062" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202734"/>
      <stop offset="1" stop-color="#1B2230"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204 126) rotate(41) scale(380 280)">
      <stop stop-color="#58D1C9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#58D1C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 98) rotate(135) scale(430 320)">
      <stop stop-color="#6AA6FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#26303D" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#03080F" flood-opacity="0.28"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="1160" height="620" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="20" y="20" width="1160" height="620" rx="34" fill="url(#pageBg)"/>
    <rect x="20" y="20" width="1160" height="620" rx="34" fill="url(#grid)" opacity="0.22"/>
    <circle cx="208" cy="126" r="300" fill="url(#glowA)"/>
    <circle cx="1040" cy="98" r="340" fill="url(#glowB)"/>
    <rect x="20" y="20" width="1160" height="620" rx="34" stroke="#334050"/>
  </g>

  <rect x="72" y="56" width="194" height="38" rx="19" fill="#58D1C91A" stroke="#58D1C94D"/>
  <text x="169" y="80" text-anchor="middle" fill="#58D1C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.08em">FEATURE OVERVIEW</text>
  <rect x="72" y="108" width="205" height="10" rx="5" fill="url(#accent)"/>
  <text x="72" y="186" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="60" font-weight="800">What You Get</text>

  <!-- Card 1: Timeline View -->
  <g>
    <rect x="72" y="240" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="72" y="240" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="73.5" y="241.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="96" y="270" width="40" height="40" rx="12" fill="#58D1C918" stroke="#58D1C940"/>
    <polyline points="102,305 110,291 120,297 130,279" fill="none" stroke="#58D1C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="102" cy="305" r="2.5" fill="#58D1C9"/>
    <circle cx="110" cy="291" r="2.5" fill="#58D1C9"/>
    <circle cx="120" cy="297" r="2.5" fill="#58D1C9"/>
    <circle cx="130" cy="279" r="2.5" fill="#58D1C9"/>
    <text x="150" y="271" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Timeline View</text>
    <text x="150" y="297" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Follow how each table changed over time</text>
  </g>

  <!-- Card 2: Schema Diff -->
  <g>
    <rect x="624" y="240" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="624" y="240" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="625.5" y="241.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="648" y="270" width="40" height="40" rx="12" fill="#6AA6FF18" stroke="#6AA6FF40"/>
    <rect x="652" y="274" width="13" height="13" rx="3" stroke="#8ABBFF" stroke-width="2.5" fill="none"/>
    <rect x="669" y="293" width="13" height="13" rx="3" stroke="#8ABBFF" stroke-width="2.5" fill="none"/>
    <path d="M 665 281 H 676 V 293" stroke="#8ABBFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="702" y="271" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Schema Diff</text>
    <text x="702" y="297" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Compare any two versions side by side</text>
  </g>

  <!-- Card 3: ER Diagram -->
  <g>
    <rect x="72" y="360" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="72" y="360" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="73.5" y="361.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="96" y="390" width="40" height="40" rx="12" fill="#58D1C918" stroke="#58D1C940"/>
    <line x1="112" y1="402" x2="120" y2="402" stroke="#58D1C9" stroke-width="2"/>
    <line x1="108" y1="407" x2="114" y2="415" stroke="#58D1C9" stroke-width="2"/>
    <line x1="124" y1="407" x2="118" y2="415" stroke="#58D1C9" stroke-width="2"/>
    <circle cx="106" cy="402" r="5.5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <circle cx="126" cy="402" r="5.5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <circle cx="116" cy="420" r="5.5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <text x="150" y="391" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">ER Diagram</text>
    <text x="150" y="417" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Inspect relationships in a live ER diagram</text>
  </g>

  <!-- Card 4: Validation -->
  <g>
    <rect x="624" y="360" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="624" y="360" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="625.5" y="361.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="648" y="390" width="40" height="40" rx="12" fill="#F5C46B16" stroke="#F5C46B38"/>
    <path d="M 668 395 L 681 401 L 681 412 C 681 420 668 425 668 425 C 668 425 655 420 655 412 L 655 401 Z" stroke="#F5C46B" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M 661 412 L 666 417 L 676 406" stroke="#F5C46B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="702" y="391" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Validation</text>
    <text x="702" y="417" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Validate history before runtime errors</text>
  </g>

  <!-- Card 5: Suggested Migrations -->
  <g>
    <rect x="72" y="480" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="72" y="480" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="73.5" y="481.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="96" y="510" width="40" height="40" rx="12" fill="#6AA6FF18" stroke="#6AA6FF40"/>
    <line x1="101" y1="521" x2="117" y2="521" stroke="#8ABBFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="101" y1="530" x2="117" y2="530" stroke="#8ABBFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="101" y1="539" x2="117" y2="539" stroke="#8ABBFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 121 522 L 131 530 L 121 538" stroke="#8ABBFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="150" y="511" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Suggested Migrations</text>
    <text x="150" y="537" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Generate migrations from schema changes</text>
  </g>

  <!-- Card 6: Risk Scoring -->
  <g>
    <rect x="624" y="480" width="504" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="624" y="480" width="504" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="625.5" y="481.5" width="501" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="648" y="510" width="40" height="40" rx="12" fill="#FF806018" stroke="#FF806038"/>
    <rect x="654" y="538" width="8" height="8" rx="2" fill="#58D1C9"/>
    <rect x="665" y="530" width="8" height="16" rx="2" fill="#F5C46B"/>
    <rect x="676" y="520" width="8" height="26" rx="2" fill="#FF8060"/>
    <text x="702" y="511" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Risk Scoring</text>
    <text x="702" y="537" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Score risk on drops and type changes</text>
  </g>
</svg>
