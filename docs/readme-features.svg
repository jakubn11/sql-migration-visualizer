<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SQL Migration Visualizer features</title>
  <desc id="desc">Feature overview showing nine capability cards: Timeline View, Schema Diff, ER Diagram, Validation, Suggested Migrations, Risk Scoring, Search, Dialect Support, and Create Migration.</desc>
  <defs>
    <linearGradient id="pageBg" x1="98" y1="40" x2="1114" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131821"/>
      <stop offset="1" stop-color="#1B222D"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="120" x2="1010" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58D1C9"/>
      <stop offset="0.58" stop-color="#6AA6FF"/>
      <stop offset="1" stop-color="#8ABBFF"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="138" y1="240" x2="1062" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202734"/>
      <stop offset="1" stop-color="#1B2230"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204 126) rotate(41) scale(380 280)">
      <stop stop-color="#58D1C9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#58D1C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 98) rotate(135) scale(430 320)">
      <stop stop-color="#6AA6FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#26303D" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#03080F" flood-opacity="0.28"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="1160" height="620" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="20" y="20" width="1160" height="620" rx="34" fill="url(#pageBg)"/>
    <rect x="20" y="20" width="1160" height="620" rx="34" fill="url(#grid)" opacity="0.22"/>
    <circle cx="208" cy="126" r="300" fill="url(#glowA)"/>
    <circle cx="1040" cy="98" r="340" fill="url(#glowB)"/>
    <rect x="20" y="20" width="1160" height="620" rx="34" stroke="#334050"/>
  </g>

  <rect x="72" y="56" width="194" height="38" rx="19" fill="#58D1C91A" stroke="#58D1C94D"/>
  <text x="169" y="80" text-anchor="middle" fill="#58D1C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.08em">FEATURE OVERVIEW</text>
  <rect x="72" y="108" width="205" height="10" rx="5" fill="url(#accent)"/>
  <text x="72" y="186" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="60" font-weight="800">What You Get</text>

  <!-- Row 1 ─────────────────────────────────────────────── -->

  <!-- Card 1: Timeline View (72, 240) -->
  <g>
    <rect x="72" y="240" width="340" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="72" y="240" width="340" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="73.5" y="241.5" width="337" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="88" y="270" width="40" height="40" rx="12" fill="#58D1C918" stroke="#58D1C940"/>
    <polyline points="94,302 102,288 112,294 122,278" fill="none" stroke="#58D1C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="94" cy="302" r="2.5" fill="#58D1C9"/>
    <circle cx="102" cy="288" r="2.5" fill="#58D1C9"/>
    <circle cx="112" cy="294" r="2.5" fill="#58D1C9"/>
    <circle cx="122" cy="278" r="2.5" fill="#58D1C9"/>
    <text x="144" y="271" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Timeline View</text>
    <text x="144" y="295" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Browse each table's change history</text>
  </g>

  <!-- Card 2: Schema Diff (430, 240) -->
  <g>
    <rect x="430" y="240" width="340" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="430" y="240" width="340" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="431.5" y="241.5" width="337" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="446" y="270" width="40" height="40" rx="12" fill="#6AA6FF18" stroke="#6AA6FF40"/>
    <rect x="450" y="274" width="13" height="13" rx="3" stroke="#8ABBFF" stroke-width="2.5" fill="none"/>
    <rect x="467" y="291" width="13" height="13" rx="3" stroke="#8ABBFF" stroke-width="2.5" fill="none"/>
    <path d="M 463 281 H 474 V 291" stroke="#8ABBFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="502" y="271" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Schema Diff</text>
    <text x="502" y="295" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Compare any two versions side by side</text>
  </g>

  <!-- Card 3: ER Diagram (788, 240) -->
  <g>
    <rect x="788" y="240" width="340" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="788" y="240" width="340" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="789.5" y="241.5" width="337" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="804" y="270" width="40" height="40" rx="12" fill="#58D1C918" stroke="#58D1C940"/>
    <line x1="819" y1="282" x2="829" y2="282" stroke="#58D1C9" stroke-width="2"/>
    <line x1="818" y1="286" x2="820" y2="295" stroke="#58D1C9" stroke-width="2"/>
    <line x1="830" y1="286" x2="828" y2="295" stroke="#58D1C9" stroke-width="2"/>
    <circle cx="814" cy="282" r="5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <circle cx="834" cy="282" r="5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <circle cx="824" cy="300" r="5" stroke="#58D1C9" stroke-width="2" fill="none"/>
    <text x="860" y="271" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">ER Diagram</text>
    <text x="860" y="295" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Inspect table relationships visually</text>
  </g>

  <!-- Row 2 ─────────────────────────────────────────────── -->

  <!-- Card 4: Validation (72, 360) -->
  <g>
    <rect x="72" y="360" width="340" height="100" rx="20" fill="#1B2230" opacity="0.01" filter="url(#shadow)"/>
    <rect x="72" y="360" width="340" height="100" rx="20" fill="url(#cardBg)" stroke="#334050"/>
    <rect x="73.5" y="361.5" width="337" height="97" rx="18.5" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <rect x="88" y="390" width="40" height="40" rx="12" fill="#F5C46B16" stroke="#F5C46B38"/>
    <path d="M 108 394 L 121 400 L 121 411 C 121 419 108 425 108 425 C 108 425 95 419 95 411 L 95 400 Z" stroke="#F5C46B" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M 101 411 L 106 416 L 116 405" stroke="#F5C46B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="144" y="391" dominant-baseline="hanging" fill="#EEF4FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Validation</text>
    <text x="144" y="415" dominant-baseline="hanging" fill="#C4CEE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Validate history before runtime errors</text>
  </g>

